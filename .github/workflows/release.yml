name: Build standalone runtime

# Builds the PyInstaller standalone bundle (see packaging/pyinstaller/) for
# Linux and Windows, verifies each one actually launches (not just that
# PyInstaller exits 0), and publishes the results as a GitHub Release.
#
# Versioning is internal to this workflow, not something a human has to
# assign per release: the `version` job below reads the highest existing
# `vMAJOR.MINOR.PATCH` git tag and bumps the patch number (v0.1.4 ->
# v0.1.5; v0.1.0 if no tag exists yet). The tag is created and pushed by the
# `release` job at the end, and only when every build and its tests passed -
# a failed run leaves no tag (and no half-filled release) behind, and the
# next run reuses the number. Pushing a `v*` tag by hand still works and is
# used verbatim (skips the auto-bump) - useful for a deliberate major/minor
# bump; its release is published the same way, once every build passed.
#
# Runs on every push to main (continuous delivery - each merge becomes a
# release) and on-demand via workflow_dispatch; `concurrency` below
# serializes runs so two triggers close together can't race on the same
# tag number.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # needed to push the version tag and publish the GitHub Release

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full tag history, needed to find the latest v* tag

      - name: Resolve release version
        id: resolve
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Explicit tag push: use it verbatim, no auto-bump.
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            version="${latest#v}"
            major="${version%%.*}"
            rest="${version#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "Resolved next version: $next (latest existing: ${latest:-none})"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          # Not tagged here: the `release` job tags only once every build passed.

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Slim builds: no PyTorch. Cellpose is available by pointing them
          # at an external torch (vtea_napari.runtime) - which is also the
          # only way to get GPU acceleration, since a bundled torch can
          # never be overridden by one on sys.path.
          - os: ubuntu-latest
            asset_name: vtea-napari-linux
            binary: vtea-napari
            deeplearning: false
          - os: windows-latest
            asset_name: vtea-napari-windows
            binary: vtea-napari.exe
            deeplearning: false
          # Deep-learning builds: CPU-only PyTorch + Cellpose baked in, so
          # Cellpose segmentation works with no setup and no network. Much
          # larger, and CPU-only by construction (see the spec's guard).
          - os: ubuntu-latest
            asset_name: vtea-napari-linux-deeplearning
            binary: vtea-napari
            deeplearning: true
          - os: windows-latest
            asset_name: vtea-napari-windows-deeplearning
            binary: vtea-napari.exe
            deeplearning: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Qt's system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          # PyQt6 (unlike PyQt5) loads the system's libEGL; GitHub's Ubuntu
          # runners do not have it, and PyInstaller rightly does not bundle
          # system graphics libraries (a Linux desktop has them). Without it
          # the self-test fails with "libEGL.so.1: cannot open shared object
          # file" when the widgets import QtGui.
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3

      - name: Install vtea-core and vtea-napari (standalone extra)
        run: |
          pip install -e "packages/vtea-core"
          pip install -e "packages/vtea-napari[standalone]"

      - name: Install CPU-only PyTorch and Cellpose
        if: matrix.deeplearning
        shell: bash
        run: |
          # The CPU index is not optional. PyPI's default Linux torch is a
          # CUDA build, which makes a 4.9 GB bundle - over the 2 GiB cap on
          # a release asset - and cannot be stripped back down to CPU. The
          # spec hard-fails on a CUDA torch rather than building it.
          #
          # torchvision comes from the same CPU index, installed with torch:
          # left to `pip install cellpose`, it came from PyPI, whose Linux
          # torchvision is built against the CUDA torch, so its compiled ops
          # did not load with the CPU one ("operator torchvision::nms does not
          # exist" when the self-test imported Cellpose).
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install cellpose

      - name: Build
        shell: bash
        run: scripts/build_standalone.sh dist

      - name: Self-test - the packaged build resolves its plugins and reads an image
        shell: bash
        # A packaged app that waits for something (an error dialog on Windows)
        # must fail the job, not hold the runner for GitHub's 6-hour limit.
        timeout-minutes: 10
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # The launch smoke test below only proves the app starts. It never
          # touches the plugin commands that npe2 resolves lazily from
          # strings, nor the package metadata they read at import time - so
          # v0.1.0 shipped a build that started fine and then died with
          # "No package metadata was found for imageio" the first time a
          # user opened a file. This exercises those paths directly.
          "dist/vtea-napari/${{ matrix.binary }}" --self-test

      - name: Smoke test - the binary launches without error
        shell: python
        timeout-minutes: 10
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # Plain "timeout <binary>" isn't reliably available on the
          # Windows leg of this matrix, so use Python's own subprocess
          # timeout instead - identical behavior on every runner OS.
          import subprocess
          import sys

          def as_text(value):
              # TimeoutExpired.stdout/.stderr are always bytes, even with
              # text=True on the original run() call - only the
              # non-timeout CompletedProcess path honors text=True.
              if value is None:
                  return ""
              return value.decode(errors="replace") if isinstance(value, bytes) else value

          binary = "dist/vtea-napari/${{ matrix.binary }}"
          try:
              result = subprocess.run(
                  [binary], capture_output=True, text=True, timeout=15
              )
              output = as_text(result.stdout) + as_text(result.stderr)
          except subprocess.TimeoutExpired as exc:
              # Timing out is expected: a working GUI app blocks in its
              # event loop until closed. Capture what it printed before
              # the timeout killed it.
              output = as_text(exc.stdout) + as_text(exc.stderr)

          print(output)
          lowered = output.lower()

          # GitHub's Windows runners have no real or software OpenGL context
          # even under QT_QPA_PLATFORM=offscreen (Linux runners have Mesa
          # llvmpipe backing offscreen mode; Windows ones don't). A packaged
          # app that reaches vispy's canvas creation and fails specifically
          # on a GL_INVALID_OPERATION from glGetIntegerv is hitting that CI
          # environment gap, not a packaging defect - a real user's machine
          # has an actual GPU/display. Known signatures for that failure
          # mode only; anything else still hard-fails the build.
          known_gl_limitation_markers = (
              "opengl.error.glerror",
              "qopenglwidget is not supported on this platform",
              "createplatformopenglcontext",
              "glGetIntegerv".lower(),
          )
          has_traceback = "traceback" in lowered or "failed to execute script" in lowered
          is_known_gl_limitation = has_traceback and any(
              marker in lowered for marker in known_gl_limitation_markers
          )

          if is_known_gl_limitation:
              print(
                  "::warning::Smoke test hit the known headless-OpenGL "
                  "limitation of GitHub's Windows runners (no real/software "
                  "GL context under QT_QPA_PLATFORM=offscreen) rather than a "
                  "packaging failure - see packaging/pyinstaller/README.md. "
                  "Treating as a pass."
              )
          elif has_traceback:
              print("::error::Standalone build failed to launch cleanly")
              sys.exit(1)

      - name: Package the distributable (.7z)
        shell: bash
        run: |
          set -euo pipefail
          # Both formats on purpose:
          # .7z only. Solid LZMA2 measured ~31% smaller and ~31% faster to
          # extract than zip on these bundles, because it decompresses as
          # one stream rather than a separate deflate stream per file - and
          # per-file cost is what makes these archives slow to unpack.
          # Extracting needs 7-Zip (or any modern archiver) on Windows.
          command -v 7z >/dev/null || sudo apt-get install -y -qq p7zip-full
          cd dist
          7z a -t7z -m0=lzma2 -mx=5 -mmt=on "../${{ matrix.asset_name }}.7z" vtea-napari >/dev/null
          cd ..
          files=$(find dist/vtea-napari -type f | wc -l)
          size=$(du -h "${{ matrix.asset_name }}.7z" | cut -f1)
          echo "| ${{ matrix.asset_name }}.7z | $size | $files files |" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.7z

  # Tag and publish only after every build (and its self-test and smoke test)
  # passed. `needs: build` waits for the whole matrix; with the default
  # success() condition a single failed or cancelled build skips this job, so
  # nothing is tagged or published and the version number is used again next
  # time.
  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the existing tags, to see whether this one exists

      - name: Download the four bundles
        uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true

      - name: Create and push the version tag
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          ls -l release-assets
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            # A tag pushed by hand, or a re-run of this job: fine when it is
            # this commit, an error when it names another one.
            tagged="$(git rev-list -n1 "$TAG")"
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG already exists on $tagged, not on this commit ($GITHUB_SHA)"
              exit 1
            fi
            echo "$TAG already points at this commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: release-assets/*.7z
