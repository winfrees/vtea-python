name: vtea-napari
display_name: VTEA
# npe2 plugin manifest.
# Protocol Builder (Phase 4, Option A - see /docs/PORT_PLAN.md): the
# step-stack pipeline builder. Object Explorer: the MicroExplorer-
# equivalent scatter plot + gate table + gallery view. Neighborhoods:
# neighbourhoods as a second level of objects, on the same viewer.
contributions:
  commands:
    - id: vtea-napari.protocol_builder
      python_name: vtea_napari.widgets:ProtocolBuilderWidget
      title: Open Protocol Builder
    - id: vtea-napari.object_explorer
      python_name: vtea_napari.widgets:ExplorerWidget
      title: Open Object Explorer
    - id: vtea-napari.neighborhoods
      python_name: vtea_napari.widgets:NeighborhoodWidget
      title: Open Neighborhoods
  widgets:
    - command: vtea-napari.protocol_builder
      display_name: Protocol Builder
    - command: vtea-napari.object_explorer
      display_name: Object Explorer
    - command: vtea-napari.neighborhoods
      display_name: Neighborhoods
